<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>N2 Study Lab — Enterprise Learning System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            jp: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    .perspective { perspective: 1400px; }
    .flashcard { transform-style: preserve-3d; transition: transform .6s cubic-bezier(.34, 1.45, .64, 1); position: relative; }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
    .progress-bar { transition: width .3s ease; }
    .hide-scroll::-webkit-scrollbar { display:none; }
    .hide-scroll { scrollbar-width:none; }
    
    /* Active sidebar item */
    .sidebar-item.active {
      background-color: rgba(37, 99, 235, 0.1);
      color: #2563eb;
      font-weight: 600;
      border-right: 3px solid #2563eb;
    }
    .dark .sidebar-item.active {
      background-color: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border-right: 3px solid #3b82f6;
    }

    /* MUI-Style Bottom Sheet Drawer Animations */
    @keyframes drawerBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes drawerSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes dialPopIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-backdrop-fade {
      animation: drawerBackdropFade 0.25s cubic-bezier(0, 0, 0.2, 1) forwards;
    }
    .animate-drawer-slide-up {
      animation: drawerSlideUp 0.35s cubic-bezier(0, 0, 0.2, 1) forwards;
    }
    .animate-dial-pop {
      animation: dialPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Smooth transition for active tab indicator */
    .nav-tab-indicator {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @supports(padding-bottom: env(safe-area-inset-bottom)) {
      .mob-bottom-bar { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
